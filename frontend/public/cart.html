<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — Lumière</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.cart-layout{display:grid;grid-template-columns:1fr 360px;gap:40px;padding:60px 4%}
.cart-items-list{display:flex;flex-direction:column;gap:0}
.cart-item{display:grid;grid-template-columns:90px 1fr auto;gap:20px;padding:24px 0;border-bottom:1px solid var(--border);align-items:center}
.cart-item-img{background:linear-gradient(135deg,#F5EFE0,#EDE3CC);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden}
.cart-item-img img{width:100%;height:100%;object-fit:cover}
.cart-item-cat{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-dark);font-weight:400;margin-bottom:4px}
.cart-item-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--dark);margin-bottom:4px}
.cart-item-price{font-size:13px;color:var(--muted);font-weight:300}
.qty-ctrl{display:flex;align-items:center;gap:0;margin-top:12px}
.qty-ctrl button{width:30px;height:30px;background:var(--card-bg);border:1px solid var(--border);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.qty-ctrl button:hover{background:var(--dark);color:var(--gold)}
.qty-ctrl span{width:36px;height:30px;border:1px solid var(--border);border-left:none;border-right:none;text-align:center;font-size:13px;display:flex;align-items:center;justify-content:center}
.item-total{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--dark);text-align:right}
.item-remove{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;margin-top:8px;text-align:right;background:none;border:none;font-family:'Jost',sans-serif;font-weight:300}
.item-remove:hover{color:var(--red)}
.order-summary{background:var(--card-bg);border:1px solid var(--border);padding:28px;position:sticky;top:80px;align-self:start}
.summary-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;color:var(--dark);margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.summary-row{display:flex;justify-content:space-between;margin-bottom:14px;font-size:13px}
.summary-row span:first-child{color:var(--muted);font-weight:300}
.summary-row span:last-child{color:var(--dark);font-weight:400}
.summary-total{display:flex;justify-content:space-between;padding-top:16px;margin-top:4px;border-top:1px solid var(--border)}
.summary-total span:first-child{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.summary-total span:last-child{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;color:var(--dark)}
.empty-cart{text-align:center;padding:100px 20px;grid-column:1/-1}
.empty-cart-icon{font-size:64px;margin-bottom:20px;opacity:0.3}
.page-title{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:300;color:var(--dark);padding:40px 4%;border-bottom:1px solid var(--border)}
.page-title em{font-style:italic;color:var(--gold-dark)}
@media(max-width:768px){.cart-layout{grid-template-columns:1fr}.cart-item{grid-template-columns:70px 1fr}}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">Lu<span>miè</span>re</a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li><li><a href="/shop">Shop</a></li><li><a href="/account">Account</a></li>
    <li id="adminNavItem" style="display:none"><a href="/admin" style="color:var(--gold)">Admin ✦</a></li>
  </ul>
  <div class="nav-actions">
    <a href="/account" class="nav-icon-btn">👤</a>
    <button class="nav-cart-btn" onclick="window.location='/cart'">Cart <span class="cart-count nav-badge">0</span></button>
  </div>
</nav>

<h1 class="page-title">Your <em>Cart</em></h1>

<div class="cart-layout" id="cartLayout">
  <div style="text-align:center;padding:60px;color:var(--muted);grid-column:1/-1">Loading...</div>
</div>

<script src="/js/app.js"></script>
<script>
function renderCart() {
  const items = Cart.get();
  const layout = document.getElementById('cartLayout');
  if (!items.length) {
    layout.innerHTML = `
      <div class="empty-cart">
        <div class="empty-cart-icon">💎</div>
        <p style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--dark);margin-bottom:8px">Your cart is empty</p>
        <p style="color:var(--muted);font-size:13px;font-weight:300;margin-bottom:28px">Add some beautiful pieces to get started.</p>
        <a href="/shop" class="btn btn-dark">Browse Collection</a>
      </div>`;
    return;
  }

  const subtotal = Cart.total();
  const shipping = subtotal >= 5000 ? 0 : 350;
  const total = subtotal + shipping;

  layout.innerHTML = `
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)">${items.length} item${items.length !== 1 ? 's' : ''}</span>
        <button onclick="Cart.clear();renderCart()" style="background:none;border:none;cursor:pointer;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-family:'Jost',sans-serif;font-weight:300;text-decoration:underline">Clear Cart</button>
      </div>
      <div class="cart-items-list">
        ${items.map(item => `
          <div class="cart-item">
            <div class="cart-item-img">${item.image_url ? `<img src="${String(item.image_url).replace(/"/g, '&quot;')}" alt="">` : item.emoji}</div>
            <div>
              <div class="cart-item-cat">${item.category}</div>
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-price">Rs ${Number(item.price).toLocaleString()} each</div>
              <div class="qty-ctrl">
                <button onclick="Cart.updateQty(${item.product_id},${item.quantity - 1});renderCart()">−</button>
                <span>${item.quantity}</span>
                <button onclick="Cart.updateQty(${item.product_id},${item.quantity + 1});renderCart()">+</button>
              </div>
            </div>
            <div>
              <div class="item-total">Rs ${Number(item.price * item.quantity).toLocaleString()}</div>
              <button class="item-remove" onclick="Cart.remove(${item.product_id});renderCart()">Remove</button>
            </div>
          </div>
        `).join('')}
      </div>
      <div style="margin-top:24px">
        <a href="/shop" style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:300;display:inline-flex;align-items:center;gap:8px">← Continue Shopping</a>
      </div>
    </div>
    <div class="order-summary">
      <div class="summary-title">Order Summary</div>
      <div class="summary-row"><span>Subtotal</span><span>Rs ${Number(subtotal).toLocaleString()}</span></div>
      <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? '<span style="color:green;font-size:11px">FREE</span>' : 'Rs ' + shipping}</span></div>
      ${shipping > 0 ? `<p style="font-size:11px;color:var(--muted);font-weight:300;margin-bottom:10px">Add Rs ${Number(5000 - subtotal).toLocaleString()} more for free shipping</p>` : ''}
      <div class="summary-total"><span>Total</span><span>Rs ${Number(total).toLocaleString()}</span></div>
      <a href="/checkout" class="btn btn-gold" style="display:block;text-align:center;margin-top:20px;width:100%;padding:14px">Proceed to Checkout</a>
      <p style="text-align:center;font-size:10px;color:var(--muted);margin-top:14px;font-weight:300;letter-spacing:1px">Cash on Delivery Available</p>
    </div>
  `;
}
renderCart();
</script>
<script>
(async () => {
  try {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (data.user && data.user.role === 'admin') {
      const el = document.getElementById('adminNavItem');
      if (el) el.style.display = '';
    }
  } catch(e) {}
})();
</script>
<script src="/js/chatbot-widget.js"></script>
</body>
</html>
