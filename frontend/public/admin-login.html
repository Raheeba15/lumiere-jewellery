<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Lumière</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--dark:#1A1410;--mid:#3D2E1E;--cream:#FAF7F2;--border:rgba(201,168,76,0.25)}
body{font-family:'Jost',sans-serif;background:var(--dark);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
body::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23C9A84C' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.login-box{background:#FFFDF9;width:100%;max-width:420px;padding:48px;position:relative;z-index:1}
.login-logo{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:var(--dark);letter-spacing:5px;text-transform:uppercase;text-align:center;margin-bottom:8px}
.login-logo em{font-style:italic}
.login-sub{text-align:center;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#7A6A58;font-weight:300;margin-bottom:36px;padding-bottom:28px;border-bottom:1px solid var(--border)}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#7A6A58;font-weight:400;margin-bottom:8px}
.form-input{width:100%;padding:12px 16px;background:#FAF7F2;border:1px solid var(--border);color:#2C2218;font-family:'Jost',sans-serif;font-size:13px;font-weight:300;outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--gold)}
.submit-btn{width:100%;padding:14px;background:var(--dark);color:var(--gold);border:none;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;font-weight:400;transition:all 0.2s;margin-top:8px}
.submit-btn:hover{background:var(--mid)}
.error-msg{background:#FFF0F0;border:1px solid #F5C6CB;color:#721C24;padding:10px 14px;font-size:12px;margin-bottom:16px;font-weight:300}
.back-link{display:block;text-align:center;margin-top:20px;font-size:11px;color:#7A6A58;font-weight:300;letter-spacing:1px;text-decoration:none;transition:color 0.2s}
.back-link:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">Lu<em>miè</em>re</div>
  <div class="login-sub">Admin Dashboard</div>

  <div id="errorMsg" class="error-msg" style="display:none">Invalid email or password. Please try again.</div>

  <!-- We use a real form post here for simplicity -->
  <form method="POST" action="/admin/login">
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-input" name="email" placeholder="yamna@gmail.com" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="submit-btn">Sign In to Dashboard</button>
  </form>
  <a href="/" class="back-link">← Back to Store</a>
</div>
<script>
  if (window.location.search.includes('error=1')) {
    document.getElementById('errorMsg').style.display = 'block';
  }
</script>
</body>
</html>
