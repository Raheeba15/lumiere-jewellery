<div class="shop-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-title">Category</div>
    <div id="categoryFilters">
      <label class="filter-option active"><input type="radio" name="category" value="all" checked onchange="applyFilters()"> All Jewellery</label>
    </div>

    <div class="sidebar-title">Sort By</div>
    <label class="filter-option"><input type="radio" name="sort" value="" checked onchange="applyFilters()"> Featured</label>
    <label class="filter-option"><input type="radio" name="sort" value="price_asc" onchange="applyFilters()"> Price: Low to High</label>
    <label class="filter-option"><input type="radio" name="sort" value="price_desc" onchange="applyFilters()"> Price: High to Low</label>
    <label class="filter-option"><input type="radio" name="sort" value="newest" onchange="applyFilters()"> Newest First</label>

    <div class="sidebar-title">Price Range</div>
    <div class="price-range" style="flex-direction:column;align-items:flex-start;gap:10px">
      <div style="display:flex;gap:8px;align-items:center">
        <input type="number" class="form-input" id="priceMin" placeholder="Min" style="width:100px" onchange="applyFilters()">
        <span style="color:var(--muted)">—</span>
        <input type="number" class="form-input" id="priceMax" placeholder="Max" style="width:100px" onchange="applyFilters()">
      </div>
    </div>

    <div style="margin-top:24px">
      <button class="btn btn-outline btn-sm" onclick="clearFilters()" style="width:100%">Clear Filters</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main>
    <div class="search-bar">
      <input class="search-input" type="text" id="searchInput" placeholder="Search jewellery..." onkeydown="if(event.key==='Enter')applyFilters()">
      <button class="search-btn" onclick="applyFilters()">🔍</button>
    </div>
    <div class="shop-toolbar">
      <span class="results-count" id="resultsCount">Loading...</span>
      <select class="sort-select" id="sortSelect" onchange="applyFilters()">
        <option value="">Featured</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="newest">Newest First</option>
      </select>
    </div>
    <div class="products-grid" id="productsGrid">
      <div style="text-align:center;padding:60px;color:var(--muted);grid-column:1/-1">Loading products...</div>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>
</div>

<footer style="background:var(--dark);padding:30px 4%;text-align:center;border-top:1px solid rgba(201,168,76,0.15)">
  <p style="color:rgba(255,255,255,0.4);font-size:11px;font-weight:300">© 2025 Lumière Fine Jewellery</p>

<script src="/js/app.js"></script>
<script>
let currentPage = 1;
let allProducts = [];

async function loadCategories() {
  const data = await API.get('/api/products/meta/categories');
  const container = document.getElementById('categoryFilters');
  container.innerHTML = `<label class="filter-option active"><input type="radio" name="category" value="all" checked onchange="applyFilters()"> All Jewellery</label>`;
  data.categories.forEach(c => {
    container.innerHTML += `<label class="filter-option"><input type="radio" name="category" value="${c.slug}" onchange="applyFilters()"> ${c.emoji} ${c.name} <span style="color:var(--muted);font-size:11px">(${c.product_count})</span></label>`;
  });

  // Apply URL param
  const urlCat = new URLSearchParams(window.location.search).get('category');
  if (urlCat) {
    const radio = container.querySelector(`input[value="${urlCat}"]`);
    if (radio) { radio.checked = true; radio.closest('.filter-option').classList.add('active'); container.querySelector('.filter-option').classList.remove('active'); }
  }
}

async function applyFilters(page = 1) {
  currentPage = page;
  const category = document.querySelector('input[name=category]:checked')?.value || 'all';
  const sort = document.getElementById('sortSelect').value;
  const search = document.getElementById('searchInput').value;
  const priceMin = document.getElementById('priceMin').value;
  const priceMax = document.getElementById('priceMax').value;

  // Update active state on sidebar radios
  document.querySelectorAll('.filter-option').forEach(el => {
    const input = el.querySelector('input');
    if (input) el.classList.toggle('active', input.checked);
  });

  let url = `/api/products?page=${page}&limit=12`;
  if (category && category !== 'all') url += `&category=${category}`;
  if (sort) url += `&sort=${sort}`;
  if (search) url += `&search=${encodeURIComponent(search)}`;

  const data = await API.get(url);
  let products = data.products || [];

  // Client-side price filter
  if (priceMin) products = products.filter(p => p.price >= parseFloat(priceMin));
  if (priceMax) products = products.filter(p => p.price <= parseFloat(priceMax));

  document.getElementById('resultsCount').textContent = `${products.length} piece${products.length !== 1 ? 's' : ''} found`;

  const grid = document.getElementById('productsGrid');
  if (!products.length) {
    grid.innerHTML = `<div class="no-results"><div class="no-results-icon">💎</div><p>No pieces found matching your criteria.</p><button class="btn btn-dark btn-sm" onclick="clearFilters()" style="margin-top:16px">Clear Filters</button></div>`;
  } else {
    grid.innerHTML = products.map(p => renderProductCard(p)).join('');
  }

  // Pagination
  const totalPages = Math.ceil(data.total / 12);
  const pagDiv = document.getElementById('pagination');
  pagDiv.innerHTML = '';
  if (totalPages > 1) {
    for (let i = 1; i <= totalPages; i++) {
      pagDiv.innerHTML += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="applyFilters(${i})">${i}</button>`;
    }
  }
}

function clearFilters() {
  document.querySelector('input[name=category][value=all]').checked = true;
  document.getElementById('searchInput').value = '';
  document.getElementById('priceMin').value = '';
  document.getElementById('priceMax').value = '';
  document.getElementById('sortSelect').value = '';
  applyFilters();
}

loadCategories().then(() => applyFilters());
</script>
<script>
(async () => {
  try {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (data.user && data.user.role === 'admin') {
      const el = document.getElementById('adminNavItem');
      if (el) el.style.display = '';
    }
  } catch(e) {}
})();
</script>
