<div id="chat" style="border:1px solid #ccc;height:300px;overflow-y:auto;padding:10px;"></div>
<input id="message" placeholder="Type..." />
<button id="send">Send</button>

<script>
const chatDiv = document.getElementById('chat');
const msgInput = document.getElementById('message');
const sendBtn = document.getElementById('send');

function appendMessage(sender, text) {
  const p = document.createElement('p');
  p.textContent = sender + ': ' + text;
  chatDiv.appendChild(p);
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

sendBtn.addEventListener('click', async () => {
  const message = msgInput.value.trim();
  if (!message) return;
  appendMessage('You', message);
  msgInput.value = '';

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message })
  });
  const data = await res.json();

  appendMessage('Bot', data.reply);

  // Optional: handle action results
  if (data.action?.type === 'products') {
    data.action.data.forEach(p => appendMessage('Bot', `- ${p.name} (Rs ${p.price})`));
  }
});
</script>
