<!DOCTYPE html>
<html>
<head>
<title>Lumiere Image Debug</title>
<style>
body{font-family:sans-serif;padding:20px;background:#1a1410;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}
.card{background:#2a1f15;border-radius:8px;overflow:hidden;padding:10px}
img{width:100%;height:200px;object-fit:cover;display:block;background:#333;border-radius:4px}
.sku{font-size:11px;color:#C9A84C;margin-top:6px;font-family:monospace}
.url{font-size:10px;color:#888;word-break:break-all;margin-top:4px}
.err{color:#f88;font-size:11px;margin-top:4px}
</style>
</head>
<body>
<h2 style="color:#C9A84C">Lumière — Image Debug Page</h2>
<p style="color:#aaa">Each card shows what URL is stored in the DB and whether the image loads.</p>
<div class="grid" id="grid">Loading...</div>
<script>
fetch('/api/products?limit=30')
  .then(r => r.json())
  .then(data => {
    const grid = document.getElementById('grid');
    grid.innerHTML = (data.products || []).map(p => `
      <div class="card">
        <img src="${p.image_url || ''}" alt="${p.name}"
             onerror="this.style.border='2px solid #f55';this.nextElementSibling.textContent='IMAGE FAILED TO LOAD'"
             onload="this.style.border='2px solid #4f5'">
        <div class="sku">${p.sku} — ${p.name}</div>
        <div class="url">${p.image_url || 'NO URL IN DB'}</div>
        <div class="err"></div>
      </div>
    `).join('');
  });
</script>
</body>
</html>
